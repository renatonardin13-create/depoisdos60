<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="920" height="280">
  <defs>
    <!-- "60" Yellow-Lime to Deep Emerald Gradient -->
    <linearGradient id="sixtyGradientLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2F952" />
      <stop offset="15%" stop-color="#B8F01D" />
      <stop offset="35%" stop-color="#72D20A" />
      <stop offset="65%" stop-color="#22C55E" />
      <stop offset="90%" stop-color="#16A34A" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>

    <!-- Sprout Leaves Gradient -->
    <linearGradient id="sproutLight1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22C55E" />
      <stop offset="50%" stop-color="#4ADE80" />
      <stop offset="100%" stop-color="#BEF264" />
    </linearGradient>

    <linearGradient id="sproutLight2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16A34A" />
      <stop offset="60%" stop-color="#4ADE80" />
      <stop offset="100%" stop-color="#A7F3D0" />
    </linearGradient>

    <!-- Gold Rule Gradient -->
    <linearGradient id="goldRuleLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <filter id="glowDarkBg" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <g transform="translate(15, 15)">
    <!-- SPROUTING LEAVES ON THE 'i' OF "Depois" -->
    <g transform="translate(266, 24)">
      <!-- Left Leaf -->
      <path d="M 8,36 C 2,28 -3,14 3,4 C 11,-4 22,2 24,11 C 27,24 16,33 8,36 Z" fill="url(#sproutLight1)" />
      <path d="M 6,28 C 6,18 11,10 16,5" stroke="#DCFCE7" stroke-width="1.2" stroke-linecap="round" fill="none" />
      
      <!-- Right Leaf (Larger, Angled Up-Right) -->
      <path d="M 16,38 C 18,28 26,16 38,8 C 50,3 58,12 55,24 C 50,38 32,41 16,38 Z" fill="url(#sproutLight2)" />
      <path d="M 22,32 C 28,22 38,18 48,13" stroke="#F0FDF4" stroke-width="1.2" stroke-linecap="round" fill="none" />
      
      <!-- Seed at Base -->
      <ellipse cx="14" cy="40" rx="4.5" ry="5.5" fill="#4ADE80" />
    </g>

    <!-- MAIN BRAND TITLE: "Depois dos 60" with Crisp White Text for Dark Backgrounds -->
    <g transform="translate(0, 126)">
      <!-- "Depois" in solid crisp pure white sans-serif -->
      <text x="0" y="0" font-family="'Montserrat', 'Poppins', 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="900" font-size="138" fill="#FFFFFF" letter-spacing="-3" filter="url(#glowDarkBg)">
        Depois
      </text>

      <!-- "dos" in matching solid crisp white sans-serif -->
      <text x="455" y="0" font-family="'Montserrat', 'Poppins', 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="900" font-size="138" fill="#FFFFFF" letter-spacing="-3" filter="url(#glowDarkBg)">
        dos
      </text>

      <!-- "60" in glowing lime-to-emerald gradient sans-serif -->
      <text x="682" y="3.5" font-family="'Montserrat', 'Poppins', 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="900" font-size="172" fill="#064E3B" letter-spacing="-4">
        60
      </text>
      <text x="678" y="0" font-family="'Montserrat', 'Poppins', 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="900" font-size="172" fill="url(#sixtyGradientLight)" letter-spacing="-4">
        60
      </text>
      <text x="677" y="-1.5" font-family="'Montserrat', 'Poppins', 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="900" font-size="172" fill="none" stroke="#FEF08A" stroke-width="2" stroke-linejoin="round" letter-spacing="-4" opacity="0.9">
        60
      </text>
    </g>

    <!-- SUBTITLE: "Guia Prático de Prevenção & Autonomia" in Soft White/Cream -->
    <text x="6" y="188" font-family="'Montserrat', 'Poppins', 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="800" font-size="38.5" fill="#E2E8F0" letter-spacing="-0.5">
      Guia Prático de Prevenção &amp; Autonomia
    </text>

    <!-- TAGLINE BAR: Luminous Golden Line — MAIS SAÚDE • MAIS VIDA • SEM LIMITES — Luminous Golden Line -->
    <g transform="translate(6, 222)">
      <!-- Left Golden Rule -->
      <line x1="0" y1="12" x2="110" y2="12" stroke="url(#goldRuleLight)" stroke-width="3.5" stroke-linecap="round" />
      
      <!-- Tagline Text in Radiant Gold -->
      <text x="125" y="19" font-family="'Montserrat', 'Poppins', 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="800" font-size="18.5" fill="#FBBF24" letter-spacing="3.2">
        MAIS SAÚDE   •   MAIS VIDA   •   SEM LIMITES
      </text>
      
      <!-- Right Golden Rule -->
      <line x1="728" y1="12" x2="838" y2="12" stroke="url(#goldRuleLight)" stroke-width="3.5" stroke-linecap="round" />
    </g>
  </g>
</svg>
