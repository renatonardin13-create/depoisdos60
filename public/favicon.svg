<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Rich emerald-forest gradient -->
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#022C22" />
    </linearGradient>

    <!-- Golden edge glow -->
    <linearGradient id="favBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Golden sun/sparkle radial glow -->
    <radialGradient id="sunBurst" cx="85%" cy="18%" r="60%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#F59E0B" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0" />
    </radialGradient>

    <!-- Drop shadow for maximum contrast and punch -->
    <filter id="favDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <!-- Leaf gradients -->
    <linearGradient id="leafLeft" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803D" />
      <stop offset="100%" stop-color="#4ADE80" />
    </linearGradient>
    <linearGradient id="leafRight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16A34A" />
      <stop offset="100%" stop-color="#86EFAC" />
    </linearGradient>
  </defs>

  <!-- Modern App Icon Base: High-contrast rounded squircle -->
  <rect 
    x="4" 
    y="4" 
    width="120" 
    height="120" 
    rx="28" 
    fill="url(#favBg)" 
    stroke="url(#favBorder)" 
    stroke-width="5" 
  />

  <!-- Sunburst glow at top right -->
  <rect 
    x="6" 
    y="6" 
    width="116" 
    height="116" 
    rx="25" 
    fill="url(#sunBurst)" 
    pointer-events="none" 
  />

  <!-- Subtle golden sun sparkle in corner -->
  <g transform="translate(100, 24)" filter="url(#favDropShadow)">
    <circle cx="0" cy="0" r="6" fill="#FEF08A" />
    <path d="M 0,-12 L 0,12 M -12,0 L 12,0" stroke="#FDE047" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="0" cy="0" r="3" fill="#FFFFFF" />
  </g>

  <!-- Brand Sprouting Leaves on top (Symbol of longevity & prevention) -->
  <g transform="translate(64, 26) scale(0.95)" filter="url(#favDropShadow)">
    <!-- Left Leaf -->
    <path 
      d="M 0,12 C -15,-6 -30,6 -20,22 C -10,28 0,18 0,12 Z" 
      fill="url(#leafLeft)" 
    />
    <!-- Right Leaf -->
    <path 
      d="M 0,12 C 15,-6 30,6 20,22 C 10,28 0,18 0,12 Z" 
      fill="url(#leafRight)" 
    />
    <!-- Center bud / stem -->
    <circle cx="0" cy="14" r="2.5" fill="#FEF08A" />
  </g>

  <!-- Main Punchy "60+" Typography - Ultra bold, instant recognition in tiny tab bar -->
  <g filter="url(#favDropShadow)">
    <!-- Number 60 -->
    <text 
      x="54" 
      y="90" 
      font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Outfit', 'Plus Jakarta Sans', sans-serif" 
      font-weight="900" 
      font-size="62" 
      letter-spacing="-3" 
      text-anchor="middle"
    >
      <!-- "6" in Brilliant Pure White -->
      <tspan fill="#FFFFFF">6</tspan>
      <!-- "0" in Vibrant Golden Amber -->
      <tspan fill="#FBBF24" dx="-2">0</tspan>
    </text>

    <!-- Plus Symbol "+" in Vibrant Lime/Emerald -->
    <text 
      x="102" 
      y="66" 
      font-family="system-ui, -apple-system, sans-serif" 
      font-weight="900" 
      font-size="34" 
      fill="#4ADE80" 
      text-anchor="middle"
    >+</text>
  </g>

  <!-- Bottom Mini Gold Banner / Safety Dot: "SAÚDE" or subtle golden line -->
  <g transform="translate(64, 108)" filter="url(#favDropShadow)">
    <rect x="-34" y="0" width="68" height="6" rx="3" fill="#F59E0B" opacity="0.9" />
    <circle cx="0" cy="3" r="2" fill="#FFFFFF" />
  </g>
</svg>
